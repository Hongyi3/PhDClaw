[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "clawbio-scholar"
version = "0.1.0.dev0"
description = "Local-first research operating system for reproducible biomedical PhD workflows."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "PLACEHOLDER", email = "maintainer@example.org" }
]
dependencies = [
  "jsonschema>=4.23,<5",
]

[project.optional-dependencies]
dev = [
  "pytest>=9,<10",
  "ruff>=0.15,<0.16",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["packages/project-schema/src"]

[tool.setuptools.package-data]
project_schema = ["schemas/*.json"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
pythonpath = [".", "packages/project-schema/src"]
testpaths = ["tests"]
