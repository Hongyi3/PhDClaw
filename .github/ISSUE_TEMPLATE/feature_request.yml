name: Feature request
description: Propose a scoped feature aligned with the roadmap
title: "[feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What academic or workflow problem does this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: Describe the smallest coherent solution.
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Scope checks
      options:
        - label: This stays within the biomedical / computational-biology PhD focus.
          required: true
        - label: This does not rely on fabricated citations or unverifiable claims.
          required: true
